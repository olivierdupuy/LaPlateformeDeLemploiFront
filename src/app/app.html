@if (platform.maintenanceMode && !isAdmin) {
  <div class="maintenance-page">
    <div class="maintenance-card">
      <span class="eyebrow eyebrow--plum">Interruption de service</span>
      <h1>Nous remettons la plateforme <span class="em em-plum">d'aplomb</span></h1>
      <p>Le site est momentanément indisponible, le temps d'une maintenance. Revenez d'ici quelques minutes.</p>
      <div class="maintenance-pulse"><span></span><span></span><span></span></div>
    </div>
  </div>
} @else {
  <!-- Le bandeau d'emprunt precede tout : il doit rester visible quel que
       soit le gabarit, public ou administration. -->
  <app-impersonation-banner />

  @if (isAdminArea()) {
    <!-- Le panneau d'administration porte sa propre coquille. -->
    <router-outlet />
  } @else {
    <a class="skip-link" href="#contenu">Aller au contenu</a>
    <app-site-banner />
    <app-navbar />
    <main id="contenu" tabindex="-1">
      <router-outlet />
    </main>
    <app-footer />
  }

  <!-- L'authentification est une couche, pas une page : elle se pose sur
       ce qui est affiché plutôt que de le remplacer. Rendue hors du
       branchement d'administration, elle reste disponible aux gardes,
       qui s'en servent depuis n'importe quelle route. -->
  <app-auth-modal />
}
<!-- Le bandeau de consentement s'adresse aux visiteurs du site. Dans le
     panneau d'administration, derrière une authentification, il n'ajoute
     rien et recouvre la barre d'état. -->
@if (!isAdminArea()) {
  <app-cookie-consent />
}
