<div class="adm" [class.nav-open]="navOpen()">

  <!-- ═══ BARRE LATÉRALE ═══ -->
  <aside class="adm-side" aria-label="Navigation de l'administration">
    <a routerLink="/admin" class="adm-brand" (click)="closeNav()">
      <img src="/images/logo-lpde.svg" alt="" width="64" height="64" />
      <span class="adm-brand__text">
        <b>La plateforme</b>
        <span>Administration</span>
      </span>
    </a>

    <nav class="adm-nav">
      @for (l of links; track l.path) {
        <a
          [routerLink]="l.path"
          routerLinkActive="is-active"
          #rla="routerLinkActive"
          [attr.aria-current]="rla.isActive ? 'page' : null"
          (click)="closeNav()">
          <i class="bi" [class]="l.icon" aria-hidden="true"></i>
          <span>{{ l.label }}</span>
        </a>
      }
    </nav>

    <div class="adm-side__foot">
      <a routerLink="/" class="adm-back" (click)="closeNav()">
        <i class="bi bi-box-arrow-up-right" aria-hidden="true"></i> Voir le site
      </a>

      @if (auth.currentUser(); as u) {
        <div class="adm-user">
          <span class="adm-user__av">{{ initials() }}</span>
          <span class="adm-user__id">
            <strong>{{ u.firstName }} {{ u.lastName }}</strong>
            <span>{{ u.email }}</span>
          </span>
          <button class="adm-user__out" (click)="logout()" aria-label="Se déconnecter">
            <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
          </button>
        </div>
      }
    </div>
  </aside>

  <!-- Voile de fermeture sur petit écran -->
  <button class="adm-scrim" (click)="closeNav()" tabindex="-1" aria-hidden="true"></button>

  <!-- ═══ CONTENU ═══ -->
  <div class="adm-main">
    <!-- ═══ BARRE SUPÉRIEURE ═══ -->
    <header class="adm-topbar">
      <button class="adm-burger" (click)="toggleNav()"
              [attr.aria-expanded]="navOpen()" aria-label="Ouvrir la navigation">
        <i class="bi" [class.bi-list]="!navOpen()" [class.bi-x-lg]="navOpen()" aria-hidden="true"></i>
      </button>

      <!-- Fil d'Ariane : où l'on est, sans avoir à relire la barre latérale -->
      <nav class="adm-crumb" aria-label="Fil d'Ariane">
        <span class="adm-topbar__tag">Administration</span>
        <i class="bi bi-chevron-right" aria-hidden="true"></i>
        <strong>{{ section() }}</strong>
      </nav>

      <!-- La recherche vise la section consultée : chercher « Dupont »
           depuis les candidatures ne doit pas ouvrir des offres. -->
      <form class="adm-search" (ngSubmit)="submitSearch()" role="search">
        <i class="bi bi-search" aria-hidden="true"></i>
        <input type="search" [ngModel]="query()" (ngModelChange)="query.set($event)"
               name="q" [placeholder]="searchHint()" [attr.aria-label]="searchHint()" />
        <kbd aria-hidden="true">↵</kbd>
      </form>

      <div class="adm-topbar__actions">
        <a routerLink="/admin/moderation" class="adm-tb-act" title="File de modération">
          <i class="bi bi-check2-square" aria-hidden="true"></i>
        </a>
        <a routerLink="/" class="adm-tb-act" title="Voir le site public">
          <i class="bi bi-box-arrow-up-right" aria-hidden="true"></i>
        </a>
        @if (auth.currentUser(); as u) {
          <span class="adm-tb-user" [title]="u.email">{{ initials() }}</span>
        }
      </div>
    </header>

    <main class="adm-content">
      <router-outlet />
    </main>

    <!-- ═══ BARRE D'ÉTAT ═══ -->
    <app-admin-statusbar />
  </div>
</div>
